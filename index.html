<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>M Aurora</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14181d;
      color: #f4f1ec;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      padding: 24px;
    }
    .eyebrow {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #b8a380;
      margin-bottom: 20px;
    }
    h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 400; letter-spacing: 0.04em; }
    .divider { width: 48px; height: 1px; background: #b8a380; margin: 28px auto; }
    .note {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #c9c4bb;
      max-width: 44ch;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Mah Sing</p>
    <h1>M Aurora</h1>
    <div class="divider"></div>
    <p class="note">This page is reserved for the M Aurora project site. The full site is launching soon.</p>
  </main>
</body>
</html>
